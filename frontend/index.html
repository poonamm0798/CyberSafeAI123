
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSafeAI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<div class="container">
    <h1>🛡️ CyberSafeAI</h1>
    <p class="subtitle">AI-Powered Cybersecurity Assistant</p>

    <div class="card">
        <h2>Analyze a Message</h2>

        <textarea
            id="message"
            placeholder="Paste a suspicious message here..."
        ></textarea>

        <button id="analyzeBtn">Analyze Message</button>

        <div id="result" class="result">

            <div class="result-item">
                <strong>Threat:</strong>
                <span id="threat">-</span>
            </div>

            <div class="result-item">
                <strong>Type:</strong>
                <span id="type">-</span>
            </div>

            <div class="result-item">
                <strong>Explanation:</strong>
                <p id="explanation">-</p>
            </div>

            <div class="result-item">
                <strong>Advice:</strong>
                <p id="advice">-</p>
            </div>

        </div>
    </div>

    <p class="footer">Stay Safe. Think Before You Click. 🔐</p>
</div>

<script src="script.js"></script>
```

</body>
</html>
